<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Bilanzreise</title><style>
:root{--navy:#18324a;--blue:#2563a6;--light:#eff5fa;--border:#c9d6e2;--green:#18785a}*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#1b2d3e;font:16px/1.5 system-ui,-apple-system,Arial}header{background:linear-gradient(110deg,#17324d,#27658d);color:white;padding:26px max(20px,calc((100% - 1050px)/2))}header h1{margin:0;font-size:clamp(25px,4vw,36px)}header p{margin:4px 0}main{max-width:1050px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 12px #17324d0a}h2{margin:0 0 12px;color:var(--navy)}h3{color:var(--navy);margin:20px 0 8px}p{margin:8px 0 14px}.muted{color:#596e7e}.progress{height:11px;background:#d4e0e9;border-radius:20px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#42b9a5;transition:width .2s}label{display:block;font-weight:600;margin:8px 0 4px}input,select{width:100%;min-height:39px;border:1px solid #aebfce;border-radius:7px;padding:7px 9px;background:#fff;color:#182f43;font:inherit}input[type=number]{min-width:100px}button{border:0;border-radius:8px;padding:11px 16px;font:600 15px system-ui;cursor:pointer;background:var(--blue);color:white}button:hover{filter:brightness(.94)}button:disabled{background:#aebbc5;cursor:not-allowed}.secondary{background:#dbe7f1;color:#17324d}.danger{background:#a34435}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid #e1e9f0;text-align:left;vertical-align:middle}th{background:#edf3f8;color:#17324d}td input,td select{min-width:110px}.num{text-align:right;font-variant-numeric:tabular-nums}.hint{border:1px solid #c6d7e4;border-radius:9px;padding:12px;margin:8px 0}.hint button{margin-right:9px}.hint small{display:block;margin-top:7px}.notice{background:#edf7f4;padding:12px;border-left:4px solid #27856b;border-radius:5px}.warn{background:#fff3e8;padding:12px;border-left:4px solid #c77b29;border-radius:5px}.footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.modalback{position:fixed;inset:0;background:#071b2ebd;display:grid;place-items:center;padding:16px;z-index:10}.modal{max-width:480px;background:white;border-radius:14px;padding:25px}.pill{display:inline-block;padding:4px 10px;border-radius:30px;background:#d9e9f4;font-weight:700}.result{font-size:24px;font-weight:800}.error{padding:10px;border-bottom:1px solid #d8e3eb}.error strong{display:block}.tk{border:1px solid #b9c9d8;border-radius:8px;overflow:hidden;margin:12px 0}.tk>h4{margin:0;padding:8px;background:#e6eff7}.tk .cols>div{padding:10px}.tk .cols>div:first-child{border-right:2px solid #577188}.tk ul{padding-left:20px;margin:4px 0}.tk .cols{gap:0}.scorecard{border:2px solid #26688b;border-radius:12px;padding:18px;background:#f3f8fb}@media(max-width:700px){.cols,.grid3{grid-template-columns:1fr}.panel{padding:14px}table{font-size:13px}th,td{padding:5px}td select,td input{min-width:120px}}@media print{header,.progress,.hint,.footer,button,.no-print{display:none!important}body{background:white}main{margin:0;max-width:none}.panel{box-shadow:none;break-inside:avoid}.error{break-inside:avoid}}
</style></head><body><header><h1>Die Bilanzreise</h1><p>Von der Eröffnungsbilanz zur Schlussbilanz · 4. Klasse Hotelfachschule</p></header><main id="app"></main><div id="modalroot"></div><script>
'use strict';
const MAX=[8,7,8,9,7,7,4], TOTAL=50;
const ACC={equip:'Betriebs- und Geschäftsausstattung',vehicle:'Fuhrpark',stock:'Warenbestand',ar:'Forderungen aus Lieferungen und Leistungen',bank:'Bank',cash:'Kassa',equity:'Eigenkapital',loan:'Darlehen',mortgage:'Hypothekardarlehen',ap:'Verbindlichkeiten aus Lieferungen und Leistungen',tax:'Steuerverbindlichkeiten',buy:'Wareneinkauf',sales:'Umsatzerlöse',rent:'Mietaufwand',interestIn:'Zinserträge',interestOut:'Zinsaufwand',ebk:'Eröffnungsbilanzkonto (EBK)',sbk:'Schlussbilanzkonto (SBK)',guv:'Gewinn- und Verlustkonto (GuV)'};
const ASSETS=['equip','stock','ar','bank','cash'], LIABS=['equity','loan','ap'];
const OPEN={equip:80000,stock:10000,ar:10000,bank:30000,cash:5000,loan:40000,ap:15000};
const sum=a=>a.reduce((x,y)=>x+y,0);OPEN.equity=sum(ASSETS.map(k=>OPEN[k]))-sum(LIABS.filter(k=>k!=='equity').map(k=>OPEN[k]));
const CASES=[{text:'Das Hotel stellt einem Reiseveranstalter für Übernachtungen 20.000 € in Rechnung. Der Reiseveranstalter überweist den Betrag anschließend auf das Bankkonto.',entries:[{dr:'ar',cr:'sales',amount:20000},{dr:'bank',cr:'ar',amount:20000}]},{text:'Für das Hotelrestaurant werden Lebensmittel im Wert von 5.000 € auf Ziel eingekauft.',entries:[{dr:'buy',cr:'ap',amount:5000}]},{text:'Die Miete für zusätzliche Lagerräume in Höhe von 3.000 € wird fällig. Die Rechnung geht im Hotel ein.',entries:[{dr:'rent',cr:'ap',amount:3000}]},{text:'Die Bank belastet das Geschäftskonto mit 1.000 € Darlehenszinsen.',entries:[{dr:'interestOut',cr:'bank',amount:1000}]},{text:'Die Bank schreibt dem Hotel 1.000 € Zinserträge gut.',entries:[{dr:'bank',cr:'interestIn',amount:1000}]}];
const PNL=['buy','sales','rent','interestIn','interestOut'];const ALLBAL=[...ASSETS,...LIABS];
const ledger={};Object.keys(ACC).forEach(k=>ledger[k]={dr:[],cr:[]});
const add=(k,side,amount,ref)=>ledger[k][side].push({amount,ref});
ASSETS.forEach(k=>{add(k,'dr',OPEN[k],'Eröffnung');add('ebk','cr',OPEN[k],ACC[k])});LIABS.forEach(k=>{add(k,'cr',OPEN[k],'Eröffnung');add('ebk','dr',OPEN[k],ACC[k])});
CASES.forEach((c,i)=>c.entries.forEach((e,j)=>{add(e.dr,'dr',e.amount,'GF '+(i+1)+(c.entries.length>1?' / '+(j+1):''));add(e.cr,'cr',e.amount,'GF '+(i+1)+(c.entries.length>1?' / '+(j+1):''))}));
const total=(k,side)=>sum(ledger[k][side].map(x=>x.amount));const signed=k=>total(k,'dr')-total(k,'cr');
const profit=-sum(PNL.map(signed));const CLOSE={};ALLBAL.forEach(k=>CLOSE[k]=Math.abs(signed(k)));CLOSE.equity+=profit;
const assetsTotal=sum(ASSETS.map(k=>CLOSE[k]));const liabilitiesTotal=sum(LIABS.map(k=>CLOSE[k]));
if(profit<=0||assetsTotal!==liabilitiesTotal||sum(ASSETS.map(k=>OPEN[k]))!==sum(LIABS.map(k=>OPEN[k]))||MAX.reduce((a,b)=>a+b,0)!==50)throw Error('Bilanzprüfung fehlgeschlagen');
const fmt=n=>Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const pct=n=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:2})+' %';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(keys,placeholder='Konto wählen')=>'<option value="">'+placeholder+'</option>'+keys.map(k=>`<option value="${k}">${esc(ACC[k])}</option>`).join('');
const input=(id,kind='number')=>`<input id="${id}" type="${kind}" ${kind==='number'?'step="any" inputmode="decimal"':''} autocomplete="off">`;
const select=(id,keys)=>`<select id="${id}">${opts(keys)}</select>`;
const get=id=>document.getElementById(id)?.value??'';const number=id=>{let s=String(get(id)).trim().replace(/\s/g,'').replace(',','.');return s===''?null:(Number.isFinite(Number(s))?Number(s):null)};
const moneyEqual=(a,b)=>a!==null&&Math.abs(a-b)<.005;
let stage=0,person={},submissions=[],hintUsed=Array.from({length:7},()=>[false,false,false]),hintText=Array.from({length:7},()=>['','','']),score=[],mistakes=[];
const $=id=>document.getElementById(id);
const balanceTable=(values,interactive,prefix,rows=7)=>`<div class="cols"><div><h3>Aktiva</h3><div class="scroll"><table><thead><tr><th>Konto</th><th>Betrag (€)</th></tr></thead><tbody>${interactive?Array.from({length:rows},(_,i)=>`<tr><td>${select(prefix+'a'+i,ALLBAL)}</td><td>${input(prefix+'av'+i)}</td></tr>`).join(''):ASSETS.map(k=>`<tr><td>${esc(ACC[k])}</td><td class="num">${fmt(values[k])}</td></tr>`).join('')}</tbody><tfoot><tr><th>Summe Aktiva</th><th>${interactive?input(prefix+'as'):fmt(sum(ASSETS.map(k=>values[k])))}</th></tr></tfoot></table></div></div><div><h3>Passiva</h3><div class="scroll"><table><thead><tr><th>Konto</th><th>Betrag (€)</th></tr></thead><tbody>${interactive?Array.from({length:rows},(_,i)=>`<tr><td>${select(prefix+'p'+i,ALLBAL)}</td><td>${input(prefix+'pv'+i)}</td></tr>`).join(''):LIABS.map(k=>`<tr><td>${esc(ACC[k])}</td><td class="num">${fmt(values[k])}</td></tr>`).join('')}</tbody><tfoot><tr><th>Summe Passiva</th><th>${interactive?input(prefix+'ps'):fmt(sum(LIABS.map(k=>values[k])))}</th></tr></tfoot></table></div></div></div>`;
const unordered=(values,keys)=>`<div class="notice"><strong>Ungeordnete Kontenliste:</strong> ${keys.map(k=>esc(ACC[k])+' – '+fmt(values[k])).join(' · ')}</div>`;
const openingRows=()=>`<div class="scroll"><table><tr><th>Sollkonto</th><th>Habenkonto</th><th>Betrag (€)</th></tr>${Array.from({length:14},(_,i)=>`<tr><td>${select('o_d'+i,Object.keys(ACC))}</td><td>${select('o_c'+i,Object.keys(ACC))}</td><td>${input('o_v'+i)}</td></tr>`).join('')}</table></div>`;
const journal=()=>CASES.map((c,i)=>`<div class="panel" style="background:#f8fbfd"><strong>Geschäftsfall ${i+1}</strong><p>${esc(c.text)}</p>${Array.from({length:2},(_,j)=>`<div class="grid3"><div><label>Sollkonto</label>${select('j_d'+i+'_'+j,Object.keys(ACC))}</div><div><label>Habenkonto</label>${select('j_c'+i+'_'+j,Object.keys(ACC))}</div><div><label>Betrag (€)</label>${input('j_v'+i+'_'+j)}</div></div>`).join('')}</div>`).join('');
const shuffled=['interestIn','stock','sales','bank','buy','cash','interestOut','loan','equip','rent','ar','ap'];
const taccounts=()=>shuffled.map(k=>{let l=ledger[k],dr=l.dr.map(x=>`<li>${esc(x.ref)}: ${fmt(x.amount)}</li>`).join('')||'<li>—</li>',cr=l.cr.map(x=>`<li>${esc(x.ref)}: ${fmt(x.amount)}</li>`).join('')||'<li>—</li>';return `<div class="tk"><h4>${esc(ACC[k])}</h4><div class="cols"><div><b>Soll</b><ul>${dr}</ul></div><div><b>Haben</b><ul>${cr}</ul></div></div><div class="grid3" style="padding:10px"><div><label>Abschlusssaldo (€)</label>${input('t_v'+k)}</div><div><label>Abschluss auf</label><select id="t_side${k}"><option value="">Bitte wählen</option><option value="dr">Soll</option><option value="cr">Haben</option></select></div><div><label>Abschluss über</label><select id="t_target${k}"><option value="">Bitte wählen</option><option value="guv">GuV</option><option value="sbk">SBK</option></select></div></div></div>`}).join('');
const guvRows=(prefix)=>Array.from({length:6},(_,i)=>`<tr><td>${select(prefix+'k'+i,[...PNL,'equity'])}</td><td>${input(prefix+'v'+i)}</td></tr>`).join('');
const guv=()=>`${unordered(Object.fromEntries(PNL.map(k=>[k,Math.abs(signed(k))])),['interestIn','rent','sales','interestOut','buy'])}<div class="cols"><div><h3>GuV – Soll</h3><table><tr><th>Konto</th><th>Betrag</th></tr>${guvRows('g_d')}<tr><th>Summe Soll</th><td>${input('g_ds')}</td></tr></table></div><div><h3>GuV – Haben</h3><table><tr><th>Konto</th><th>Betrag</th></tr>${guvRows('g_c')}<tr><th>Summe Haben</th><td>${input('g_cs')}</td></tr></table></div></div><div class="grid3"><div><label>Ergebnisart</label><select id="g_kind"><option value="">Wählen</option><option value="profit">Gewinn</option><option value="loss">Verlust</option></select></div><div><label>Gewinn / Verlust (€)</label>${input('g_profit')}</div><div><label>Übertragung des Ergebnisses</label><select id="g_transfer"><option value="">Wählen</option><option value="equity_cr">Eigenkapital im Haben</option><option value="equity_dr">Eigenkapital im Soll</option><option value="other">Keine Übertragung</option></select></div></div>`;
const guvReference=()=>{let expenses=PNL.filter(k=>signed(k)>0),revenues=PNL.filter(k=>signed(k)<0);return `<div class="cols"><div><h3>GuV – Soll</h3><table>${expenses.map(k=>`<tr><td>${esc(ACC[k])}</td><td class="num">${fmt(signed(k))}</td></tr>`).join('')}<tr><td>Gewinn (Eigenkapital)</td><td class="num">${fmt(profit)}</td></tr><tr><th>Summe</th><th>${fmt(sum(revenues.map(k=>-signed(k))))}</th></tr></table></div><div><h3>GuV – Haben</h3><table>${revenues.map(k=>`<tr><td>${esc(ACC[k])}</td><td class="num">${fmt(-signed(k))}</td></tr>`).join('')}<tr><th>Summe</th><th>${fmt(sum(revenues.map(k=>-signed(k))))}</th></tr></table></div></div>`};
const ratios=[{name:'Eigenkapitalquote',value:CLOSE.equity/assetsTotal*100,formula:'Eigenkapital / Gesamtkapital × 100',benchmark:'Vergleichswert: mindestens 30 %',favorable:true},{name:'Anlagedeckungsgrad II',value:(CLOSE.equity+CLOSE.loan)/CLOSE.equip*100,formula:'(Eigenkapital + langfristiges Fremdkapital) / Anlagevermögen × 100',benchmark:'Vergleichswert: mindestens 100 %',favorable:true},{name:'Eigenkapitalrentabilität',value:profit/CLOSE.equity*100,formula:'Jahresgewinn / Eigenkapital am Bilanzstichtag × 100 (vereinfachte Schulformel)',benchmark:'Vergleichswert: mindestens 10 %',favorable:profit/CLOSE.equity*100>=10}];
const stageNames=['Eröffnungsbilanz erstellen','Eröffnungsbuchungen','Buchungen im Journal','Hauptbuch und Kontenabschluss','Gewinn- und Verlustkonto','Schlussbilanz','Kennzahlen berechnen und beurteilen'];
const HINTS=[['Ordnen Sie die Bestandskonten nach Vermögens- und Kapitalpositionen.','Die Aktiva folgen zunehmender Liquidierbarkeit; die Passiva zunehmender Fälligkeit.','Das Eigenkapital ist die Differenz aus Gesamtvermögen und Fremdkapital.'],['Aktivkonten und Passivkonten werden spiegelbildlich zum EBK eröffnet.','Aktivkonto an EBK; EBK an Passivkonto.','Sie dürfen mehrere Buchungszeilen verwenden. Jede Eröffnungsposition benötigt einen eigenen Betrag.'],['Fragen Sie sich zuerst, welche beiden Konten betroffen sind.','Achten Sie bei Wareneinkauf und Miete auf die offenen Verbindlichkeiten.','Bankzinsen sind eine Ausnahme: Eine Bankbelastung ist nicht dasselbe wie eine Lieferantenrechnung.'],['Vergleichen Sie für jedes T-Konto die beiden Seiten.','Der Saldo steht beim Abschluss auf der betragsmäßig kleineren Seite.','Erfolgskonten werden über GuV, Bestandskonten über SBK abgeschlossen. Das Eigenkapital folgt erst später.'],['Aufwendungen stehen im Soll der GuV, Erträge im Haben.','Die Differenz zwischen Erträgen und Aufwendungen ergibt den Periodenerfolg.','Bei Gewinn wird die GuV im Soll ausgeglichen und das Eigenkapital im Haben erhöht.'],['Verwenden Sie die Salden der Bestandskonten nach Ergebnisübertragung.','Das Eigenkapital enthält den Jahresgewinn; die Bilanzsumme muss auf beiden Seiten gleich sein.','Ordnen Sie Anlagevermögen, Umlaufvermögen und Kapital nach der verlangten Reihenfolge.'],['Setzen Sie die Werte der angezeigten Schlussbilanz und GuV ein.','Für den Anlagedeckungsgrad II zählt langfristiges Fremdkapital mit.','Beurteilen Sie die Kennzahlen anhand Ihres Fachwissens und der wirtschaftlichen Situation.']];
function render(){let app=$('app');if(stage===0){app.innerHTML=`<section class="panel"><h2>Willkommen an Bord</h2><p>Sie durchlaufen sieben Stationen. Jede Station wird verbindlich abgegeben und kann danach nicht mehr verändert werden. Lösungen und Ihre persönliche Fehleranalyse erhalten Sie am Ende.</p><div class="grid3"><div><label for="first">Vorname</label>${input('first','text')}</div><div><label for="last">Nachname</label>${input('last','text')}</div><div><label for="class">Klasse</label>${input('class','text')}</div></div><p class="muted">Maximal 50 Punkte · Positive Bewertung ab 65 % · Freiwillige Denkhilfen mit Punkteabzug.</p><div class="footer"><button id="start">Bilanzreise starten</button></div><p id="startErr" class="warn" hidden>Bitte geben Sie Vorname, Nachname und Klasse ein.</p></section>`;$('start').onclick=()=>{if(!get('first').trim()||!get('last').trim()||!get('class').trim()){$('startErr').hidden=false;return}person={first:get('first').trim(),last:get('last').trim(),class:get('class').trim()};stage=1;render()};return}
if(stage===8){renderResult();return}
let body='';if(stage===1)body=`<p>Ordnen Sie die Bilanzposten nach den entsprechenden Kriterien. Berechnen Sie das Eigenkapital selbst.</p>${unordered(OPEN,['ap','cash','stock','bank','loan','equip','ar'])}${balanceTable(OPEN,true,'b1_',6)}`;
if(stage===2)body=`<p>Erstellen Sie aus der richtigen Eröffnungsbilanz die Eröffnungsbuchungen über das EBK. Wählen Sie Soll- und Habenkonto und tragen Sie den Betrag ein. Die Anzahl benötigter Zeilen ist nicht vorgegeben.</p>${balanceTable(OPEN,false)}${openingRows()}`;
if(stage===3)body=`<p>Buchen Sie die folgenden fünf Geschäftsfälle. Mehrwertsteuer wird in dieser vereinfachten Übung nicht berücksichtigt.</p>${journal()}`;
if(stage===4)body=`<p>Die korrekten Eröffnungs- und laufenden Buchungen sind bereits in die T-Konten eingetragen. Berechnen Sie den Abschlusssaldo, die Abschlussseite und das Abschlusskonto. Das Eigenkapital wird hier bewusst nicht abgeschlossen.</p>${taccounts()}`;
if(stage===5)body=`<p>Erstellen Sie das GuV-Konto und schließen Sie es ab.</p>${guv()}`;
if(stage===6)body=`<p>Erstellen Sie die Schlussbilanz anhand der ungeordneten Bestandskontensalden. Der Periodenerfolg ist bereits im Eigenkapital enthalten. Ordnen Sie die Positionen korrekt und berechnen Sie beide Bilanzsummen.</p>${unordered(CLOSE,['ap','bank','equity','stock','ar','cash','equip','loan'])}${balanceTable(CLOSE,true,'b6_',6)}`;
if(stage===7)body=`<p>Berechnen Sie die drei Kennzahlen anhand der richtigen Schlussbilanz und GuV. Tragen Sie Ihre Ergebnisse in Prozent auf zwei Dezimalstellen gerundet ein. Beurteilen Sie die Ergebnisse fachlich.</p>${balanceTable(CLOSE,false)}${guvReference()}${ratios.map((r,i)=>`<div class="panel" style="background:#f8fbfd"><h3>${i+1}. ${esc(r.name)}</h3><div class="cols"><div><label>Ihr Ergebnis (%)</label>${input('r_v'+i)}</div><div><label>Beurteilung</label><select id="r_b${i}"><option value="">Bitte wählen</option><option value="good">günstig</option><option value="bad">ungünstig</option></select></div></div></div>`).join('')}`;
app.innerHTML=`<section class="panel"><div class="muted">${esc(person.first)} ${esc(person.last)} · ${esc(person.class)}</div><div class="progress"><div style="width:${(stage-1)/7*100}%"></div></div><span class="pill">Station ${stage} von 7 · maximal ${MAX[stage-1]} Punkte</span><h2>${esc(stageNames[stage-1])}</h2>${body}<h3>Denkhilfen (freiwillig)</h3><div id="hints">${HINTS[stage-1].map((t,i)=>`<div class="hint"><button class="secondary" id="hint${i}" ${hintUsed[stage-1][i]?'disabled':''}>Denkhilfe ${i+1} (−${i+1} P.)</button><span id="hinttxt${i}">${esc(hintText[stage-1][i])}</span></div>`).join('')}</div><div class="footer"><button id="submit">Station verbindlich abgeben</button></div></section>`;
HINTS[stage-1].forEach((_,i)=>{$('hint'+i).onclick=()=>{if(hintUsed[stage-1][i])return;hintUsed[stage-1][i]=true;hintText[stage-1][i]=HINTS[stage-1][i];$('hinttxt'+i).textContent=hintText[stage-1][i];$('hint'+i).disabled=true}});$('submit').onclick=confirmSubmit;
}
function confirmSubmit(){let root=$('modalroot');root.innerHTML=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmtitle"><h2 id="confirmtitle">Verbindliche Abgabe</h2><p>Möchten Sie Station ${stage} wirklich verbindlich abgeben? Auch leere Felder werden bewertet. Nach der Abgabe können Sie Ihre Antworten nicht mehr ändern.</p><div class="footer"><button class="danger" id="yes">Ja, verbindlich abgeben</button><button class="secondary" id="no">Zurück zur Bearbeitung</button></div></div></div>`;$('no').onclick=()=>root.innerHTML='';$('yes').onclick=()=>{root.innerHTML='';try{let result=gradeStage(stage);score.push(result.points);mistakes.push(result.errors);stage++;render();window.scrollTo?.(0,0)}catch(e){console.error(e);alert('Die Abgabe konnte nicht abgeschlossen werden. Bitte versuchen Sie es erneut.')}}}
function grader(max){let earned=0,possible=0,errors=[];return {check(label,actual,expected,weight,correct,format=x=>String(x??'—')){possible+=weight;if(correct){earned+=weight}else{errors.push({label,actual:format(actual),expected:format(expected),lost:weight})}},finish(){return {points:Math.round(max*earned/possible*100)/100,errors:errors.map(e=>({...e,lost:Math.round(max*e.lost/possible*100)/100}))}}}}
const display=x=>x===null||x===''?'(leer)':typeof x==='number'?fmt(x):ACC[x]||String(x);
function balanceGrade(prefix,values,max){let g=grader(max);for(let [side,keys,tag] of [['a',ASSETS,'Aktiva'],['p',LIABS,'Passiva']]){let entries=Array.from({length:6},(_,i)=>({key:get(prefix+side+i),amount:number(prefix+side+'v'+i),index:i+1}));keys.forEach((k,idx)=>{let hits=entries.filter(e=>e.key===k),hit=hits[0];g.check(tag+' – Konto '+ACC[k],hit?.key??'',k,2,!!hit,display);g.check(tag+' – Betrag '+ACC[k],hit?.amount??null,values[k],1,!!hit&&moneyEqual(hit.amount,values[k]),display);g.check(tag+' – Reihenfolge '+ACC[k],hit?.index??'',idx+1,0.65,!!hit&&hit.index===idx+1,x=>x===''?'(leer)':'Position '+x)});entries.filter(e=>e.key&&!keys.includes(e.key)).forEach(e=>g.check(tag+' – falsche Zuordnung in Zeile '+e.index,e.key,'Konto auf korrekter Bilanzseite',.6,false,display));let expected=sum(keys.map(k=>values[k]));g.check('Bilanzsumme '+tag,number(prefix+side+'s'),expected,2,moneyEqual(number(prefix+side+'s'),expected),display)}return g.finish()}
function gradeStage(s){if(s===1)return balanceGrade('b1_',OPEN,MAX[0]);if(s===6)return balanceGrade('b6_',CLOSE,MAX[5]);let g=grader(MAX[s-1]);if(s===2){let expected=[...ASSETS.map(k=>({dr:k,cr:'ebk',amount:OPEN[k]})),...LIABS.map(k=>({dr:'ebk',cr:k,amount:OPEN[k]}))];let rows=Array.from({length:14},(_,i)=>({dr:get('o_d'+i),cr:get('o_c'+i),amount:number('o_v'+i)}));let used=new Set();expected.forEach((e,i)=>{let candidates=rows.map((r,j)=>({...r,j})).filter(r=>!used.has(r.j));let best=candidates.sort((a,b)=>((b.dr===e.dr)*3+(b.cr===e.cr)*3+moneyEqual(b.amount,e.amount))-((a.dr===e.dr)*3+(a.cr===e.cr)*3+moneyEqual(a.amount,e.amount)))[0];if(best)used.add(best.j);g.check('Eröffnung '+ACC[e.dr]+' an '+ACC[e.cr]+' – Soll',best?.dr??'',e.dr,3,best?.dr===e.dr,display);g.check('Eröffnung '+ACC[e.dr]+' an '+ACC[e.cr]+' – Haben',best?.cr??'',e.cr,3,best?.cr===e.cr,display);g.check('Eröffnung '+ACC[e.dr]+' an '+ACC[e.cr]+' – Betrag',best?.amount??null,e.amount,1,moneyEqual(best?.amount??null,e.amount),display)});return g.finish()}
if(s===3){CASES.forEach((c,i)=>c.entries.forEach((e,j)=>{let id=i+'_'+j,dr=get('j_d'+id),cr=get('j_c'+id),v=number('j_v'+id);g.check('Geschäftsfall '+(i+1)+' Buchung '+(j+1)+' – Sollkonto',dr,e.dr,3,dr===e.dr,display);g.check('Geschäftsfall '+(i+1)+' Buchung '+(j+1)+' – Habenkonto',cr,e.cr,3,cr===e.cr,display);g.check('Geschäftsfall '+(i+1)+' Buchung '+(j+1)+' – Betrag',v,e.amount,1,moneyEqual(v,e.amount),display)}));return g.finish()}
if(s===4){shuffled.forEach(k=>{let v=number('t_v'+k),side=get('t_side'+k),target=get('t_target'+k),expected=Math.abs(signed(k)),correctSide=signed(k)>0?'cr':'dr',correctTarget=PNL.includes(k)?'guv':'sbk';g.check(ACC[k]+' – Abschlusssaldo',v,expected,2,moneyEqual(v,expected),display);g.check(ACC[k]+' – Abschlussseite',side,correctSide,1.5,side===correctSide,x=>x==='cr'?'Haben':x==='dr'?'Soll':'(leer)');g.check(ACC[k]+' – Abschlusskonto',target,correctTarget,1.5,target===correctTarget,x=>x==='guv'?'GuV':x==='sbk'?'SBK':'(leer)')});return g.finish()}
if(s===5){let expectedDr=PNL.filter(k=>signed(k)>0).map(k=>({key:k,amount:signed(k)})).concat([{key:'equity',amount:profit}]),expectedCr=PNL.filter(k=>signed(k)<0).map(k=>({key:k,amount:-signed(k)}));for(let [side,expected] of [['d',expectedDr],['c',expectedCr]]){let rows=Array.from({length:6},(_,i)=>({key:get('g_'+side+'k'+i),amount:number('g_'+side+'v'+i)}));expected.forEach(e=>{let hit=rows.find(r=>r.key===e.key);g.check('GuV '+(side==='d'?'Soll':'Haben')+' – '+ACC[e.key],hit?.key??'',e.key,2,!!hit,display);g.check('GuV '+(side==='d'?'Soll':'Haben')+' – Betrag '+ACC[e.key],hit?.amount??null,e.amount,1,!!hit&&moneyEqual(hit.amount,e.amount),display)});let val=number('g_'+side+'s'),correct=sum(expected.map(x=>x.amount));g.check('GuV '+side+' – Summe',val,correct,2,moneyEqual(val,correct),display)}g.check('Ergebnisart',get('g_kind'),'profit',2,get('g_kind')==='profit',x=>x==='profit'?'Gewinn':x==='loss'?'Verlust':'(leer)');g.check('Jahresgewinn',number('g_profit'),profit,3,moneyEqual(number('g_profit'),profit),display);g.check('Übertragung Eigenkapital',get('g_transfer'),'equity_cr',2,get('g_transfer')==='equity_cr',x=>x==='equity_cr'?'Eigenkapital im Haben':x==='equity_dr'?'Eigenkapital im Soll':'(leer)');return g.finish()}
if(s===7){ratios.forEach((r,i)=>{let v=number('r_v'+i),b=get('r_b'+i),right=r.favorable?'good':'bad';g.check(r.name+' – Kennzahl',v,Math.round(r.value*100)/100,2,v!==null&&Math.abs(v-r.value)<=.011,x=>x===null?'(leer)':pct(x));g.check(r.name+' – Beurteilung',b,right,1,b===right,x=>x==='good'?'günstig':x==='bad'?'ungünstig':'(leer)')});return g.finish()}throw Error('Unbekannte Station')}
function note(p){if(p>=50-1e-7)return '10';let q=p/1.25;if(q>=39)return '9,5';if(q>=38)return '9';if(q>=36)return '8,5';if(q>=34)return '8';if(q>=32)return '7,5';if(p>=32.5)return '6';if(q>=30)return '7';if(q>=28)return '6,5';if(q>=24)return '5,5';if(q>=22)return '5';if(q>=20)return '4,5';if(q>=18)return '4';return 'unter 4'}
// Bestehensgrenze hat Vorrang: 32,5 bis unter 35 Punkte werden mit 6 bewertet.
function noteFixed(p){if(p>=50-1e-7)return '10';if(p>=48.75)return '9,5';if(p>=47.5)return '9';if(p>=45)return '8,5';if(p>=42.5)return '8';if(p>=40)return '7,5';if(p>=37.5)return '7';if(p>=35)return '6,5';if(p>=32.5)return '6';if(p>=30)return '5,5';if(p>=27.5)return '5';if(p>=25)return '4,5';if(p>=22.5)return '4';return 'unter 4'}
function renderResult(){let gross=sum(score),deduct=sum(hintUsed.flatMap(row=>row.map((v,i)=>v?i+1:0))),final=Math.max(0,Math.round((gross-deduct)*100)/100),percent=final/50*100,n=noteFixed(final);$('app').innerHTML=`<section class="panel"><h2>Ihre Bilanzreise ist abgeschlossen!</h2><div class="scorecard"><div><strong>${esc(person.first)} ${esc(person.last)}</strong> · ${esc(person.class)}</div><p class="result">${fmt(final).replace(' €','')} / 50 Punkte · Note ${n}</p><p>${pct(percent)} · <strong>${percent>=65?'Positiv':'Nicht positiv'}</strong></p></div><h3>Ergebnisübersicht</h3><table><tr><th>Station</th><th class="num">Erreicht</th><th class="num">Maximum</th></tr>${stageNames.map((name,i)=>`<tr><td>${i+1}. ${esc(name)}</td><td class="num">${score[i].toFixed(2).replace('.',',')}</td><td class="num">${MAX[i]}</td></tr>`).join('')}<tr><th>Summe vor Abzügen</th><th class="num">${gross.toFixed(2).replace('.',',')}</th><th>50</th></tr><tr><td>Denkhilfen-Abzüge</td><td class="num">−${deduct}</td><td></td></tr><tr><th>Endpunkte</th><th class="num">${final.toFixed(2).replace('.',',')}</th><th>50</th></tr></table><div class="footer no-print"><button onclick="window.print()">Ergebnisse drucken / als PDF speichern</button></div><h2 style="margin-top:30px">Ihre persönliche Fehleranalyse</h2><p>Hier sehen Sie Ihre tatsächlich abgegebenen Antworten, die korrekten Lösungen und die jeweils nicht erreichten Punkte. Einzelwerte können durch Rundung geringfügig von der Stationssumme abweichen.</p>${mistakes.map((errs,i)=>`<h3>Station ${i+1} – ${esc(stageNames[i])}</h3>${errs.length?errs.map(e=>`<div class="error"><strong>${esc(e.label)} · nicht erreicht: ${e.lost.toFixed(2).replace('.',',')} P.</strong><div>Ihre Antwort: ${esc(e.actual)}</div><div>Richtig: ${esc(e.expected)}</div></div>`).join(''):'<p class="notice">Alle bewerteten Teilaufgaben richtig.</p>'}`).join('')}<p class="muted">Notenschlüssel: 65 % (= 32,5 Punkte) ist positiv. Die ursprünglich proportional umgerechnete Notenskala wurde für den Bereich 32,5 bis unter 35 Punkte auf Note 6 angepasst.</p><div class="footer no-print"><button onclick="window.print()">Drucken / als PDF speichern</button><button class="secondary" onclick="location.reload()">Neue Bilanzreise starten</button></div></section>`}
render();
</script></body></html>
